name: Deploy ref to preproduction

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit SHA to deploy
        required: true
        default: main
        type: string

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - id: version
        run: echo "tag=preview-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ghcr.io/quiquesancho/crossfit-api:${{ steps.version.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: [self-hosted, raspberrypi, preproduction]
    environment: preproduction
    steps:
      - name: Deploy API to preproduction
        run: |
          flock /opt/crossfit/crossfit-deploy/.deploy.lock bash -ceu '
            git -C /opt/crossfit/crossfit-deploy pull --ff-only
            cd /opt/crossfit/crossfit-deploy
            sed -i "s|^API_IMAGE=.*|API_IMAGE=ghcr.io/quiquesancho/crossfit-api:${{ needs.image.outputs.tag }}|" /opt/crossfit/preproduction/.env
            docker compose --env-file /opt/crossfit/preproduction/.env \
              -f environments/preproduction/docker-compose.yml up -d --pull always
          '
