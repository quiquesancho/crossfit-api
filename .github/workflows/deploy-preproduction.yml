name: Deploy ref to preproduction

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit SHA to deploy
        required: true
        default: main
        type: string
      maintenance:
        description: Maintenance action instead of deploying (requires confirm=PRE)
        required: false
        default: none
        type: choice
        options:
          - none
          - list-execution-data
          - reset-execution-data
          - seed-example-week
      week_start:
        description: ISO Monday of the example week (seed-example-week only)
        required: false
        default: ""
        type: string
      confirm:
        description: Type PRE to confirm a maintenance action
        required: false
        default: ""
        type: string

permissions:
  contents: read
  packages: write

jobs:
  maintenance:
    if: inputs.maintenance != 'none' && inputs.confirm == 'PRE'
    runs-on: [self-hosted, raspberrypi, preproduction]
    environment: preproduction
    concurrency: preproduction-maintenance
    steps:
      - name: Environment check
        run: |
          set -euo pipefail
          test -f /opt/crossfit/preproduction/.env
          test -f /opt/crossfit/crossfit-deploy/environments/preproduction/docker-compose.yml
          docker compose \
            --env-file /opt/crossfit/preproduction/.env \
            -f /opt/crossfit/crossfit-deploy/environments/preproduction/docker-compose.yml \
            ps

      - name: List execution data
        if: inputs.maintenance == 'list-execution-data' || inputs.maintenance == 'reset-execution-data'
        run: |
          set -euo pipefail
          docker compose \
            --env-file /opt/crossfit/preproduction/.env \
            -f /opt/crossfit/crossfit-deploy/environments/preproduction/docker-compose.yml \
            exec -T postgres sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1' <<'SQL'
          SELECT 'session_execution' AS relation, count(*) AS rows FROM session_execution
          UNION ALL SELECT 'block_execution', count(*) FROM block_execution
          UNION ALL SELECT 'set_attempt', count(*) FROM set_attempt
          UNION ALL SELECT 'typed_metric', count(*) FROM typed_metric
          UNION ALL SELECT 'feeling', count(*) FROM feeling
          UNION ALL SELECT 'substitution', count(*) FROM substitution
          UNION ALL SELECT 'planned_week', count(*) FROM planned_week
          UNION ALL SELECT 'plan_version', count(*) FROM plan_version
          ORDER BY relation;
          SQL

      - name: Reset execution data
        if: inputs.maintenance == 'reset-execution-data'
        run: |
          set -euo pipefail
          docker compose \
            --env-file /opt/crossfit/preproduction/.env \
            -f /opt/crossfit/crossfit-deploy/environments/preproduction/docker-compose.yml \
            exec -T postgres sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1' <<'SQL'
          BEGIN;
          DELETE FROM typed_metric;
          DELETE FROM feeling;
          DELETE FROM substitution;
          DELETE FROM set_attempt;
          DELETE FROM block_execution;
          DELETE FROM session_execution;
          COMMIT;
          SELECT 'session_execution' AS relation, count(*) AS rows FROM session_execution
          UNION ALL SELECT 'block_execution', count(*) FROM block_execution
          UNION ALL SELECT 'set_attempt', count(*) FROM set_attempt
          UNION ALL SELECT 'typed_metric', count(*) FROM typed_metric
          UNION ALL SELECT 'feeling', count(*) FROM feeling
          UNION ALL SELECT 'substitution', count(*) FROM substitution
          ORDER BY relation;
          SQL

      - name: Seed example planning week
        if: inputs.maintenance == 'seed-example-week'
        env:
          WEEK_START: ${{ inputs.week_start }}
        run: |
          set -euo pipefail
          if [ -z "$WEEK_START" ]; then
            echo "week_start is required for seed-example-week"
            exit 1
          fi
          docker compose \
            --env-file /opt/crossfit/preproduction/.env \
            -f /opt/crossfit/crossfit-deploy/environments/preproduction/docker-compose.yml \
            run --rm --no-deps \
            -e PLANNING_EXAMPLE_WEEK_START="$WEEK_START" \
            api node dist/db/seed-planning-example.js

  image:
    if: inputs.maintenance == 'none'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - id: version
        run: echo "tag=preview-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ghcr.io/quiquesancho/crossfit-api:${{ steps.version.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    if: vars.DEPLOY_ENABLED == 'true' && inputs.maintenance == 'none'
    runs-on: [self-hosted, raspberrypi, preproduction]
    environment: preproduction
    steps:
      - name: Deploy API to preproduction
        run: |
          flock /opt/crossfit/crossfit-deploy/.deploy.lock bash -ceu '
            git -C /opt/crossfit/crossfit-deploy pull --ff-only
            cd /opt/crossfit/crossfit-deploy
            sed -i "s|^API_IMAGE=.*|API_IMAGE=ghcr.io/quiquesancho/crossfit-api:${{ needs.image.outputs.tag }}|" /opt/crossfit/preproduction/.env
            docker compose --env-file /opt/crossfit/preproduction/.env \
              -f environments/preproduction/docker-compose.yml up -d --pull always
          '
