name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.semantic.outputs.new_release_published }}
      version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - id: semantic
        uses: cycjimmy/semantic-release-action@v4
        with:
          extra_plugins: |
            conventional-changelog-conventionalcommits
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.version }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/quiquesancho/crossfit-api:v${{ needs.release.outputs.version }}
            ghcr.io/quiquesancho/crossfit-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-production:
    needs: [release, image]
    if: needs.release.outputs.published == 'true' && vars.DEPLOY_ENABLED == 'true'
    runs-on: [self-hosted, raspberrypi, production]
    environment: production
    steps:
      - name: Deploy API to production
        run: |
          git -C /opt/crossfit/crossfit-deploy pull --ff-only
          cd /opt/crossfit/crossfit-deploy
          API_IMAGE="ghcr.io/quiquesancho/crossfit-api:v${{ needs.release.outputs.version }}" \
          docker compose --env-file /opt/crossfit/production/.env \
            -f environments/production/docker-compose.yml up -d --pull always api
