openapi: 3.1.0
info:
  title: CrossFit Training API
  version: 0.1.0
  description: Contract-first API for the CrossFit training application. Human-readable companion: `Contrato OpenAPI.md`.
servers:
  - url: https://crossfit.local/api/v1
paths:
  /calendar:
    get:
      summary: Get calendar summaries for the current athlete
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: Planned and completed training by date
          content:
            application/json:
              schema:
                type: object
                required: [days]
                properties:
                  days:
                    type: array
                    items: { $ref: '#/components/schemas/CalendarDay' }
  /planning/weeks/{weekStart}:
    get:
      summary: Get the active planning week for the current athlete
      parameters:
        - name: weekStart
          in: path
          required: true
          schema: { type: string, format: date }
      responses:
        '200': { description: Planning week and planned sessions }
        '404': { description: No active planning week }
  /session-executions:
    get:
      summary: List session execution history for the current athlete
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200':
          description: Cursor-paginated execution summaries
  /personal-records:
    get:
      summary: List confirmed personal records for the current athlete
      parameters:
        - name: movementId
          in: query
          schema: { type: string, format: uuid }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200': { description: Cursor-paginated personal record history and current references }
  /catalogs/{catalogKey}:
    get:
      summary: List active entries from an application catalog
      parameters:
        - name: catalogKey
          in: path
          required: true
          schema:
            type: string
            example: block-type
      responses:
        '200':
          description: Active catalog entries
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  entries:
                    type: array
                    items:
                      $ref: '#/components/schemas/CatalogEntry'
  /catalog/movements:
    get:
      summary: List active movements available for planning
      responses:
        '200':
          description: Active movement catalog
          content:
            application/json:
              schema:
                type: object
                required: [movements]
                properties:
                  movements:
                    type: array
                    items:
                      $ref: '#/components/schemas/Movement'
  /integrations/openclaw/training-plans/{externalPlanId}:
    put:
      summary: Publish a complete planning version for the authenticated athlete
      description: Idempotent. The service credential determines the athlete owner.
      security:
        - OpenClawServiceKey: []
      parameters:
        - name: externalPlanId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanningPublication'
      responses:
        '200':
          description: Existing equivalent version returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicationResult' }
        '201':
          description: New planning version published
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicationResult' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { description: Missing or invalid service credential }
        '403': { description: Credential lacks planning publication scope }
  /session-executions/{executionId}:
    put:
      summary: Create or replace one complete session execution
      description: Idempotent full-snapshot PWA synchronization. Omitted nested records are removed from the persisted execution. Until user authentication exists, the API assigns the local athlete profile.
      parameters:
        - name: executionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SessionExecutionWrite' }
      responses:
        '200':
          description: Execution persisted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionExecutionResult' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { description: Conflicting synchronized revision }
components:
  securitySchemes:
    OpenClawServiceKey:
      type: apiKey
      in: header
      name: X-OpenClaw-Service-Key
  responses:
    ValidationError:
      description: Contract validation failed
      content:
        application/json:
          schema:
            type: object
            required: [code, message, issues]
            properties:
              code: { type: string, const: validation_error }
              message: { type: string }
              issues:
                type: array
                items:
                  type: object
                  required: [path, message]
                  properties:
                    path: { type: string }
                    message: { type: string }
  schemas:
    Movement:
      type: object
      required: [code, name, familyCode]
      properties:
        code: { type: string, example: power-clean }
        name: { type: string, example: Power clean }
        familyCode: { type: string, example: clean }
    CatalogEntry:
      type: object
      required: [id, code, description]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, example: fuerza }
        description: { type: string, example: Trabajo de fuerza }
        displayOrder: { type: integer }
    CalendarDay:
      type: object
      required: [date, plannedSessions, executions]
      properties:
        date: { type: string, format: date }
        plannedSessions:
          type: array
          items:
            type: object
            required: [id, title]
            properties:
              id: { type: string, format: uuid }
              title: { type: string }
              primaryBlockTypeId: { type: string, format: uuid }
        executions:
          type: array
          items:
            type: object
            required: [id, status]
            properties:
              id: { type: string, format: uuid }
              status: { type: string }
              rpe: { type: integer, minimum: 1, maximum: 10 }
              plannedSessionId: { type: string, format: uuid }
              syncStatus: { type: string, enum: [synchronized, pending, error] }
    PlanningPublication:
      type: object
      required: [sourceVersion, title, weeks]
      properties:
        sourceVersion: { type: string, description: Stable version from OpenClaw }
        title: { type: string }
        weeks:
          type: array
          minItems: 1
          items:
            type: object
            required: [weekStart, sessions]
            properties:
              weekStart: { type: string, format: date }
              title: { type: string }
              priorities: { type: string }
              sessions:
                type: array
                items:
                  type: object
                  required: [externalId, plannedDate, title, blocks]
                  properties:
                    externalId: { type: string }
                    plannedDate: { type: string, format: date }
                    title: { type: string }
                    objective: { type: string }
                    durationSeconds: { type: integer, minimum: 1 }
                    targetRpe: { type: integer, minimum: 1, maximum: 10 }
                    blocks:
                      type: array
                      minItems: 1
                      items:
                        type: object
                        required: [blockTypeId, title]
                        properties:
                          blockTypeId:
                            type: string
                            format: uuid
                            description: ID from the active `block-type` catalog.
                          title: { type: string }
                          instructions: { type: string }
                          durationSeconds: { type: integer, minimum: 1 }
                          targetRpe: { type: integer, minimum: 1, maximum: 10 }
                          prescriptions:
                            type: array
                            items:
                              type: object
                              properties:
                                movementId: { type: string, format: uuid }
                                complexVersionId: { type: string, format: uuid }
                                details: { type: object, additionalProperties: true }
                                notes: { type: string }
    PublicationResult:
      type: object
      required: [trainingPlanId, planVersionId, status]
      properties:
        trainingPlanId: { type: string, format: uuid }
        planVersionId: { type: string, format: uuid }
        status: { type: string, enum: [published, unchanged] }
    SessionExecutionWrite:
      type: object
      required: [executionDate, status, blocks]
      properties:
        plannedSessionId: { type: string, format: uuid }
        executionDate: { type: string, format: date }
        status: { type: string, enum: [draft, completed, annulled] }
        generalNote: { type: string }
        blocks:
          type: array
          items:
            type: object
            required: [id, position, blockTypeId, title, status]
            properties:
              id: { type: string, format: uuid }
              plannedBlockId: { type: string, format: uuid }
              position: { type: integer, minimum: 1 }
              blockTypeId: { type: string, format: uuid }
              title: { type: string }
              status: { type: string, enum: [draft, completed, completed_without_metric, partial, skipped, abandoned] }
              notes: { type: string }
              attempts: { type: array, items: { $ref: '#/components/schemas/SetAttemptWrite' } }
              metrics: { type: array, items: { $ref: '#/components/schemas/MetricWrite' } }
              feelings: { type: array, items: { $ref: '#/components/schemas/FeelingWrite' } }
    SessionExecutionResult:
      type: object
      required: [id, status, updatedAt]
      properties:
        id: { type: string, format: uuid }
        status: { type: string }
        updatedAt: { type: string, format: date-time }
    SetAttemptWrite:
      type: object
      required: [id, position, status]
      properties:
        id: { type: string, format: uuid }
        position: { type: integer, minimum: 1 }
        movementId: { type: string, format: uuid }
        complexVersionId: { type: string, format: uuid }
        status: { type: string, enum: [completed, partial, failed, skipped] }
        note: { type: string }
        metrics:
          type: array
          items: { $ref: '#/components/schemas/MetricWrite' }
      oneOf:
        - required: [movementId]
        - required: [complexVersionId]
    MetricWrite:
      type: object
      required: [id, metricTypeId, numericValue, unitId]
      properties:
        id: { type: string, format: uuid }
        metricTypeId: { type: string, format: uuid }
        numericValue: { type: number }
        unitId: { type: string, format: uuid }
        context:
          type: object
          description: Metric-type-specific context validated by the backend.
          additionalProperties: true
    FeelingWrite:
      type: object
      required: [id]
      properties:
        id: { type: string, format: uuid }
        rpe: { type: integer, minimum: 1, maximum: 10 }
        pain: { type: integer, minimum: 0, maximum: 10 }
        recoveryId: { type: string, format: uuid }
        techniqueQualityId: { type: string, format: uuid }
        limitationId: { type: string, format: uuid }
        note: { type: string }
