openapi: 3.1.0
info:
  title: CrossFit Training API
  version: 0.1.0
  description: 'Contract-first API for the CrossFit training application. Human-readable companion: `Contrato OpenAPI.md`.'
servers:
  - url: https://crossfit.local/api/v1
paths:
  /calendar:
    get:
      summary: Get calendar summaries for the current athlete
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: Planned and completed training by date
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CalendarResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '503': { description: History query service unavailable }
  /planning/weeks/{weekStart}:
    get:
      summary: Get the active planning week for the current athlete
      parameters:
        - name: weekStart
          in: path
          required: true
          schema: { type: string, format: date, description: Monday that starts the requested week }
      responses:
        '200':
          description: Planning week and planned sessions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanningWeekView' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { description: No active planning week }
        '503': { description: Planning query service unavailable }
  /session-executions:
    get:
      summary: List session execution history for the current athlete
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200':
          description: Cursor-paginated execution summaries
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExecutionHistoryPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '503': { description: History query service unavailable }
  /personal-records:
    get:
      summary: List personal record history for the current athlete
      description: >-
        By default returns confirmed and discarded records. Suggested records are
        returned by `/personal-records/suggestions`. The history is cursor-paginated
        in reverse chronological order.
      parameters:
        - name: movementId
          in: query
          schema: { type: string, format: uuid }
        - name: complexVersionId
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { type: string, enum: [suggested, confirmed, discarded] }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200':
          description: Cursor-paginated personal record history
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonalRecordPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '503': { description: Personal record service unavailable }
  /personal-records/current:
    get:
      summary: List current confirmed personal records for the current athlete
      description: >-
        Returns one record per anchor and repetition count: the highest confirmed
        load, with the earliest achievement winning ties.
      responses:
        '200':
          description: Current personal records
          content:
            application/json:
              schema:
                type: object
                required: [records]
                properties:
                  records:
                    type: array
                    items: { $ref: '#/components/schemas/PersonalRecord' }
        '503': { description: Personal record service unavailable }
  /personal-records/suggestions:
    get:
      summary: List pending personal record suggestions for the current athlete
      description: >-
        Returns the best pending suggestion per anchor and repetition count when it
        beats the current confirmed record. Suggestions are generated from completed
        attempts synchronized with a completed session.
      responses:
        '200':
          description: Pending suggestions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PersonalRecord' }
        '503': { description: Personal record service unavailable }
  /personal-records/{recordId}:
    put:
      summary: Create or update a manual historical personal record
      description: >-
        Idempotent client-generated UUID. Manual records are confirmed immediately and
        are not linked to a set attempt. Only manual records can be updated.
      parameters:
        - name: recordId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PersonalRecordManualInput' }
      responses:
        '200':
          description: Manual record persisted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonalRecord' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { description: Personal record not found }
        '409': { description: The record was not created manually }
        '503': { description: Personal record service unavailable }
    patch:
      summary: Confirm or discard a suggested personal record
      parameters:
        - name: recordId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PersonalRecordDecision' }
      responses:
        '200':
          description: Decision persisted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonalRecord' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { description: Personal record not found }
        '409': { description: The record is not a pending suggestion or is not better than the current record }
        '503': { description: Personal record service unavailable }
  /progress/volume:
    get:
      summary: Get accumulated training volume for the current athlete
      description: >-
        Aggregates completed set attempts from completed sessions. Technical volume
        only includes attempts performed in blocks whose type code is `technique`.
        Complex attempts are not attributed to a movement and are therefore excluded
        from this movement/family breakdown.
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
        - name: groupBy
          in: query
          schema: { type: string, enum: [movement, family], default: movement }
      responses:
        '200':
          description: Volume totals and a movement or family breakdown
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VolumeResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '503': { description: Progress query service unavailable }
  /catalogs/{catalogKey}:
    get:
      summary: List active entries from an application catalog
      parameters:
        - name: catalogKey
          in: path
          required: true
          schema:
            type: string
            example: block-type
      responses:
        '200':
          description: Active catalog entries
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  entries:
                    type: array
                    items:
                      $ref: '#/components/schemas/CatalogEntry'
  /catalog/movements:
    get:
      summary: List active movements available for planning
      responses:
        '200':
          description: Active movement catalog
          content:
            application/json:
              schema:
                type: object
                required: [movements]
                properties:
                  movements:
                    type: array
                    items:
                      $ref: '#/components/schemas/Movement'
        '503': { description: Catalog service unavailable }
  /catalog/movement-families:
    get:
      summary: List active movement families
      responses:
        '200':
          description: Active movement family catalog
          content:
            application/json:
              schema:
                type: object
                required: [families]
                properties:
                  families:
                    type: array
                    items:
                      $ref: '#/components/schemas/MovementFamily'
        '503': { description: Catalog service unavailable }
  /catalog/complexes:
    get:
      summary: List published movement complexes and their immutable versions
      responses:
        '200':
          description: Published complexes with ordered steps
          content:
            application/json:
              schema:
                type: object
                required: [complexes]
                properties:
                  complexes:
                    type: array
                    items: { $ref: '#/components/schemas/ComplexCatalogEntry' }
        '503': { description: Catalog service unavailable }
  /integrations/openclaw/movement-catalog:
    put:
      summary: Import or update movement families and movements
      description: >-
        Idempotent transactional upsert authenticated with the OpenClaw service
        credential. At least one family or movement must be provided. Codes are
        stable kebab-case identifiers. Existing movements cannot change family;
        create a new code and archive the old one instead. Entries omitted from
        the payload are never deleted or archived.
      security:
        - OpenClawServiceKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MovementCatalogImport'
      responses:
        '200':
          description: Catalog import applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovementCatalogImportResult'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { description: Missing or invalid service credential }
        '409':
          description: >-
            Archived family or movement, or an existing movement that belongs to
            another family. Response codes: `family_archived`,
            `movement_archived`, `movement_family_conflict`.
        '503': { description: Movement catalog import service unavailable }
  /integrations/openclaw/training-plans/{externalPlanId}:
    put:
      summary: Publish a complete planning version for the authenticated athlete
      description: Idempotent. The service credential determines the athlete owner.
      security:
        - OpenClawServiceKey: []
      parameters:
        - name: externalPlanId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanningPublication'
      responses:
        '200':
          description: Existing equivalent version returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicationResult' }
        '201':
          description: New planning version published
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicationResult' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { description: Missing or invalid service credential }
        '403': { description: Credential lacks planning publication scope }
        '409': { description: Source version already exists with different content }
        '503': { description: Local profile or planning service unavailable }
  /session-executions/{executionId}:
    put:
      summary: Create or replace one complete session execution
      description: >-
        Idempotent full-snapshot PWA synchronization. Omitted nested records are removed
        from the persisted execution. Until user authentication exists, the API assigns
        the local athlete profile. Metrics and attempts are persisted only for blocks
        marked `completed` or `partial` and are ignored when `withoutMetrics` is true.
      parameters:
        - name: executionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SessionExecutionWrite' }
      responses:
        '200':
          description: Execution persisted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionExecutionResult' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { description: Conflicting synchronized revision }
        '503': { description: Local profile or execution synchronization service unavailable }
components:
  securitySchemes:
    OpenClawServiceKey:
      type: apiKey
      in: header
      name: X-OpenClaw-Service-Key
  responses:
    ValidationError:
      description: Contract validation failed
      content:
        application/json:
          schema:
            type: object
            required: [code, message, issues]
            properties:
              code: { type: string, const: validation_error }
              message: { type: string }
              issues:
                type: array
                items:
                  type: object
                  required: [path, message]
                  properties:
                    path: { type: string }
                    message: { type: string }
  schemas:
    Movement:
      type: object
      required: [id, code, name, familyCode]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, example: power-clean }
        name: { type: string, example: Power clean }
        familyCode: { type: string, example: clean }
    MovementFamily:
      type: object
      required: [id, code, name]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, example: clean }
        name: { type: string, example: Clean }
    MovementFamilyImport:
      type: object
      additionalProperties: false
      required: [code, name]
      properties:
        code:
          type: string
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          maxLength: 80
          example: clean
        name:
          type: string
          minLength: 1
          maxLength: 200
          example: Clean
    MovementImport:
      type: object
      additionalProperties: false
      required: [code, name, familyCode]
      properties:
        code:
          type: string
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          maxLength: 80
          example: power-clean
        name:
          type: string
          minLength: 1
          maxLength: 200
          example: Power clean
        familyCode:
          type: string
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          maxLength: 80
          example: clean
    MovementCatalogImport:
      type: object
      additionalProperties: false
      description: >-
        At least one family or movement must be present. Duplicate codes within
        the same array are rejected.
      properties:
        families:
          type: array
          maxItems: 500
          items: { $ref: '#/components/schemas/MovementFamilyImport' }
        movements:
          type: array
          maxItems: 1000
          items: { $ref: '#/components/schemas/MovementImport' }
      anyOf:
        - required: [families]
          properties:
            families:
              minItems: 1
        - required: [movements]
          properties:
            movements:
              minItems: 1
    MovementCatalogImportCounts:
      type: object
      required: [created, updated, unchanged]
      properties:
        created: { type: integer, minimum: 0 }
        updated: { type: integer, minimum: 0 }
        unchanged: { type: integer, minimum: 0 }
    MovementCatalogImportResult:
      type: object
      required: [status, families, movements]
      properties:
        status: { type: string, const: applied }
        families: { $ref: '#/components/schemas/MovementCatalogImportCounts' }
        movements: { $ref: '#/components/schemas/MovementCatalogImportCounts' }
    CatalogEntry:
      type: object
      required: [id, code, description]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, example: strength }
        description: { type: string, example: Trabajo de fuerza }
        displayOrder: { type: integer }
    PlanningWeekView:
      type: object
      required: [id, trainingPlanId, planVersionId, planTitle, weekStart, title, priorities, sessions]
      properties:
        id: { type: string, format: uuid }
        trainingPlanId: { type: string, format: uuid }
        planVersionId: { type: string, format: uuid }
        planTitle: { type: string }
        weekStart: { type: string, format: date }
        title: { type: [string, 'null'] }
        priorities: { type: [string, 'null'] }
        sessions:
          type: array
          items: { $ref: '#/components/schemas/PlannedSessionView' }
    PlannedSessionView:
      type: object
      required: [id, externalId, plannedDate, title, objective, durationSeconds, targetRpe, blocks]
      properties:
        id: { type: string, format: uuid }
        externalId: { type: [string, 'null'] }
        plannedDate: { type: string, format: date }
        title: { type: string }
        objective: { type: [string, 'null'] }
        durationSeconds: { type: [integer, 'null'], minimum: 1 }
        targetRpe: { type: [integer, 'null'], minimum: 1, maximum: 10 }
        blocks:
          type: array
          items: { $ref: '#/components/schemas/PlannedBlockView' }
    PlannedBlockView:
      type: object
      required: [id, position, blockType, title, instructions, durationSeconds, targetRpe, prescriptions]
      properties:
        id: { type: string, format: uuid }
        position: { type: integer, minimum: 1 }
        blockType: { $ref: '#/components/schemas/BlockTypeReference' }
        title: { type: string }
        instructions: { type: [string, 'null'] }
        durationSeconds: { type: [integer, 'null'], minimum: 1 }
        targetRpe: { type: [integer, 'null'], minimum: 1, maximum: 10 }
        prescriptions:
          type: array
          items: { $ref: '#/components/schemas/PrescriptionView' }
    BlockTypeReference:
      type: object
      required: [id, code, description]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        description: { type: string }
    PrescriptionView:
      type: object
      required: [id, position, movement, complex, details, allowsActualWeight, notes]
      properties:
        id: { type: string, format: uuid }
        position: { type: integer, minimum: 1 }
        movement:
          anyOf:
            - { $ref: '#/components/schemas/MovementReference' }
            - { type: 'null' }
        complex:
          anyOf:
            - { $ref: '#/components/schemas/ComplexReference' }
            - { type: 'null' }
        details: { type: object, additionalProperties: true }
        allowsActualWeight:
          type: boolean
          description: >-
            Whether the prescription accepts the actual weight used during execution.
            Computed by the API from the structured load in `details` (absolute weight,
            legacy weight in kilograms or a percentage of 1RM). The PWA must use this
            flag instead of inferring eligibility from `details`.
        notes: { type: [string, 'null'] }
    MovementReference:
      type: object
      required: [id, code, name]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
    ComplexReference:
      type: object
      required: [id, code, name, versionNumber]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        versionNumber: { type: integer, minimum: 1 }
    CalendarResponse:
      type: object
      required: [days]
      properties:
        days:
          type: array
          items: { $ref: '#/components/schemas/CalendarDay' }
    CalendarDay:
      type: object
      required: [date, planned, executions]
      properties:
        date: { type: string, format: date }
        planned:
          type: array
          items: { $ref: '#/components/schemas/CalendarPlannedSession' }
        executions:
          type: array
          items: { $ref: '#/components/schemas/ExecutionSummary' }
    CalendarPlannedSession:
      type: object
      required: [id, title, objective]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        objective: { type: [string, 'null'] }
    ExecutionSummary:
      type: object
      required:
        - id
        - executionDate
        - status
        - origin
        - title
        - plannedSessionId
        - blockCount
        - rpe
        - revision
        - updatedAt
      properties:
        id: { type: string, format: uuid }
        executionDate: { type: string, format: date }
        status: { type: string, enum: [draft, completed] }
        origin: { type: string, enum: [planned, free] }
        title: { type: string }
        plannedSessionId:
          type: [string, 'null']
          format: uuid
        blockCount: { type: integer, minimum: 0 }
        rpe:
          type: [integer, 'null']
          minimum: 1
          maximum: 10
        revision: { type: integer, minimum: 1 }
        updatedAt: { type: string, format: date-time }
    ExecutionHistoryPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ExecutionSummary' }
        nextCursor:
          type: [string, 'null']
          description: Opaque cursor for the next page; `null` on the last page.
    PlanningPublication:
      type: object
      required: [sourceVersion, title, weeks]
      properties:
        sourceVersion: { type: string, minLength: 1, description: Stable version from OpenClaw }
        title: { type: string, minLength: 1 }
        weeks:
          type: array
          minItems: 1
          items:
            type: object
            required: [weekStart, sessions]
            properties:
              weekStart: { type: string, format: date, description: Monday that starts the week }
              title: { type: string }
              priorities: { type: string }
              sessions:
                type: array
                items:
                  type: object
                  required: [externalId, plannedDate, title, blocks]
                  properties:
                    externalId: { type: string, minLength: 1 }
                    plannedDate: { type: string, format: date }
                    title: { type: string, minLength: 1 }
                    objective: { type: string }
                    durationSeconds: { type: integer, minimum: 1 }
                    targetRpe: { type: integer, minimum: 1, maximum: 10 }
                    blocks:
                      type: array
                      minItems: 1
                      items:
                        type: object
                        required: [blockTypeId, title]
                        properties:
                          blockTypeId:
                            type: string
                            format: uuid
                            description: ID from the active `block-type` catalog.
                          title: { type: string, minLength: 1 }
                          instructions: { type: string }
                          durationSeconds: { type: integer, minimum: 1 }
                          targetRpe: { type: integer, minimum: 1, maximum: 10 }
                          prescriptions:
                            type: array
                            items:
                              type: object
                              properties:
                                movementId: { type: string, format: uuid }
                                complexVersionId: { type: string, format: uuid }
                                details: { type: object, additionalProperties: true }
                                notes: { type: string }
                              not:
                                required: [movementId, complexVersionId]
    PublicationResult:
      type: object
      required: [trainingPlanId, planVersionId, status]
      properties:
        trainingPlanId: { type: string, format: uuid }
        planVersionId: { type: string, format: uuid }
        status: { type: string, enum: [published, unchanged] }
    SessionExecutionWrite:
      type: object
      additionalProperties: false
      required: [baseRevision, executionDate, status, blocks]
      properties:
        baseRevision:
          type: integer
          minimum: 0
          description: Last server revision known by the client, or 0 when creating the execution.
        plannedSessionId: { type: string, format: uuid }
        executionDate: { type: string, format: date }
        status: { type: string, enum: [draft, completed, annulled] }
        generalNote: { type: string }
        feeling: { $ref: '#/components/schemas/FeelingWrite' }
        blocks:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [id, position, blockTypeId, title, status]
            properties:
              id:
                type: string
                format: uuid
                pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
              plannedBlockId: { type: string, format: uuid }
              position: { type: integer, minimum: 1 }
              blockTypeId: { type: string, format: uuid }
              title: { type: string, minLength: 1 }
              status: { type: string, enum: [draft, completed, completed_without_metric, partial, skipped, abandoned] }
              withoutMetrics: { type: boolean, default: false }
              notes: { type: string }
              metrics: { $ref: '#/components/schemas/BlockExecutionMetricsWrite' }
              attempts:
                type: array
                items: { $ref: '#/components/schemas/SetAttemptWrite' }
              feeling: { $ref: '#/components/schemas/FeelingWrite' }
              substitutions:
                type: array
                items: { $ref: '#/components/schemas/SubstitutionWrite' }
    BlockExecutionMetricsWrite:
      type: object
      additionalProperties: false
      properties:
        rounds:
          type: integer
          minimum: 0
          description: Completed AMRAP rounds.
        extraRepetitions:
          type: integer
          minimum: 0
          description: Repetitions completed in the current AMRAP round.
        prescriptions:
          type: array
          items: { $ref: '#/components/schemas/PrescriptionExecutionMetricWrite' }
    PrescriptionExecutionMetricWrite:
      type: object
      additionalProperties: false
      required: [plannedPrescriptionId]
      properties:
        plannedPrescriptionId: { type: string, format: uuid }
        actualWeight: { $ref: '#/components/schemas/ActualWeightWrite' }
        loadStatus: { type: string, enum: [rx, scaled] }
      anyOf:
        - required: [actualWeight]
        - required: [loadStatus]
    ActualWeightWrite:
      type: object
      additionalProperties: false
      required: [amount, unit]
      properties:
        amount: { type: number, exclusiveMinimum: 0 }
        unit: { type: string, minLength: 1, maxLength: 16, example: kg }
    SessionExecutionResult:
      type: object
      required: [id, revision, status, updatedAt, result]
      properties:
        id: { type: string, format: uuid }
        revision: { type: integer, minimum: 1 }
        status: { type: string, enum: [draft, completed, annulled] }
        updatedAt: { type: string, format: date-time }
        result: { type: string, enum: [persisted, unchanged] }
    SetAttemptWrite:
      type: object
      additionalProperties: false
      required: [id, position, status]
      description: >-
        One performed set or attempt. A prescribed attempt references
        `plannedPrescriptionId`; the API resolves the actual movement from the block
        substitution when one exists, otherwise from the prescription. A free attempt
        references exactly one of `movementId` or `complexVersionId`.
      properties:
        id:
          type: string
          format: uuid
          pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
        plannedPrescriptionId: { type: string, format: uuid }
        position: { type: integer, minimum: 1 }
        movementId: { type: string, format: uuid }
        complexVersionId: { type: string, format: uuid }
        status: { type: string, enum: [completed, partial, failed, skipped] }
        note: { type: string }
        weight: { $ref: '#/components/schemas/ActualWeightWrite' }
        repetitions: { type: integer, minimum: 0 }
        durationSeconds:
          type: number
          exclusiveMinimum: 0
          maximum: 86400
          description: Optional technical-practice duration for this set or attempt.
      oneOf:
        - required: [plannedPrescriptionId]
        - required: [movementId]
        - required: [complexVersionId]
    FeelingWrite:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id:
          type: string
          format: uuid
          pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
        rpe: { type: integer, minimum: 1, maximum: 10 }
        pain: { type: integer, minimum: 0, maximum: 10 }
        recoveryId: { type: string, format: uuid }
        techniqueQualityId: { type: string, format: uuid }
        limitationId: { type: string, format: uuid }
        note: { type: string, minLength: 1 }
      anyOf:
        - required: [rpe]
        - required: [pain]
        - required: [recoveryId]
        - required: [techniqueQualityId]
        - required: [limitationId]
        - required: [note]
    SubstitutionWrite:
      type: object
      additionalProperties: false
      required: [id, plannedPrescriptionId, actualMovementId]
      properties:
        id:
          type: string
          format: uuid
          pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
        plannedPrescriptionId: { type: string, format: uuid }
        actualMovementId: { type: string, format: uuid }
        reasonId: { type: string, format: uuid }
        note: { type: string }
    MovementFamilyReference:
      type: object
      required: [id, code, name]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, example: clean }
        name: { type: string, example: Clean }
    VolumeAggregate:
      type: object
      required:
        - repetitions
        - technicalRepetitions
        - durationSeconds
        - technicalDurationSeconds
        - volumeKg
        - technicalVolumeKg
        - sessions
        - lastPracticedOn
      properties:
        repetitions: { type: integer, minimum: 0 }
        technicalRepetitions: { type: integer, minimum: 0 }
        durationSeconds: { type: number, minimum: 0 }
        technicalDurationSeconds: { type: number, minimum: 0 }
        volumeKg: { type: number, minimum: 0 }
        technicalVolumeKg: { type: number, minimum: 0 }
        sessions: { type: integer, minimum: 0 }
        lastPracticedOn:
          type: [string, 'null']
          format: date
    VolumeItem:
      allOf:
        - { $ref: '#/components/schemas/VolumeAggregate' }
        - type: object
          required: [movement, family]
          properties:
            movement:
              anyOf:
                - { $ref: '#/components/schemas/MovementReference' }
                - { type: 'null' }
            family: { $ref: '#/components/schemas/MovementFamilyReference' }
    VolumeResponse:
      type: object
      required: [from, to, groupBy, totals, items]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        groupBy: { type: string, enum: [movement, family] }
        totals: { $ref: '#/components/schemas/VolumeAggregate' }
        items:
          type: array
          items: { $ref: '#/components/schemas/VolumeItem' }
    PersonalRecord:
      type: object
      required:
        - id
        - status
        - sourceType
        - movement
        - complex
        - repetitions
        - loadKg
        - achievedOn
        - confirmedAt
        - note
        - originAttemptId
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [suggested, confirmed, discarded] }
        sourceType: { type: string, enum: [attempt, manual_historical] }
        movement:
          anyOf:
            - { $ref: '#/components/schemas/MovementReference' }
            - { type: 'null' }
        complex:
          anyOf:
            - { $ref: '#/components/schemas/ComplexReference' }
            - { type: 'null' }
        repetitions: { type: integer, minimum: 1 }
        loadKg: { type: number, minimum: 0 }
        achievedOn: { type: string, format: date }
        confirmedAt:
          type: [string, 'null']
          format: date-time
        note: { type: [string, 'null'] }
        originAttemptId:
          type: [string, 'null']
          format: uuid
          description: Source set attempt when it still exists.
        previousLoadKg:
          type: [number, 'null']
          description: Current confirmed load to beat; present in suggestions.
    PersonalRecordPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PersonalRecord' }
        nextCursor:
          type: [string, 'null']
          description: Opaque cursor for the next page; `null` on the last page.
    PersonalRecordManualInput:
      type: object
      additionalProperties: false
      required: [repetitions, loadKg, achievedOn]
      properties:
        movementId: { type: string, format: uuid }
        complexVersionId: { type: string, format: uuid }
        repetitions: { type: integer, minimum: 1 }
        loadKg: { type: number, minimum: 0 }
        achievedOn: { type: string, format: date }
        note: { type: string }
      oneOf:
        - required: [movementId]
        - required: [complexVersionId]
      not:
        required: [movementId, complexVersionId]
    PersonalRecordDecision:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [confirmed, discarded] }
    ComplexCatalogEntry:
      type: object
      required: [id, code, name, versions]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        versions:
          type: array
          items: { $ref: '#/components/schemas/ComplexCatalogVersion' }
    ComplexCatalogVersion:
      type: object
      required: [id, versionNumber, publishedAt, steps]
      properties:
        id: { type: string, format: uuid }
        versionNumber: { type: integer, minimum: 1 }
        publishedAt:
          type: [string, 'null']
          format: date-time
        steps:
          type: array
          items: { $ref: '#/components/schemas/ComplexCatalogStep' }
    ComplexCatalogStep:
      type: object
      required: [position, repetitions, movement]
      properties:
        position: { type: integer, minimum: 1 }
        repetitions: { type: integer, minimum: 1 }
        movement: { $ref: '#/components/schemas/MovementReference' }
